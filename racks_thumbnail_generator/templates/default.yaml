name: "racks-default"

format:
  width: 1080
  height: 1920
  orientation: "vertical 9:16"

style:
  font_family: "Inter"
  aesthetic: "editorial photography, photorealistic, cinematic, A24 film still aesthetic, premium magazine cover quality, NOT sci-fi, NOT cluttered"

scene:
  description: "{{concepto_visual}}"
  guidance: >
    Create a cinematic photorealistic image based on the scene description.
    The scene must FILL THE ENTIRE FRAME edge-to-edge — no borders, no panels, no flat color blocks.

    COMPOSITION FOR INSTAGRAM REEL COVER:
    - Place the MAIN subject (person, brand mark, or hero object) in the UPPER-MIDDLE region of the frame, roughly between 20% and 60% from the top. Centered horizontally is fine.
    - Leave the bottom 25-30% of the frame as quieter negative space — darker zones, shadows, dark floor, dark wood surface, out-of-focus area, or smooth backdrop. This is where text will be overlaid in post-production.
    - The bottom region must still be visually continuous with the rest of the scene (same lighting, same surface) — NOT a separate panel or solid color block.
    - Avoid placing important details, faces, or product features in the bottom 30% — they will be covered by text and partially hidden by Instagram's UI.

rules:
  - "If reference logo image(s) are provided alongside this prompt: use them AS-IS as the actual brand identity in the scene. Do not re-imagine or restyle them. Keep their exact shapes and colors. Place them creatively into the scene as described."
  - "HERO DOMINATES THE FRAME. The main subject (logo, product, artifact, person) must occupy at least 50% of the frame width and 40% of the frame height. Frame it as a tight hero close-up, not a wide context shot. Background stays out-of-focus and minimal."
  - "If the logo is printed on an object (mug, box, hoodie, billboard, etc.), the OBJECT itself must fill most of the frame so the printed logo on it reads instantly large. No tiny mugs on big desks."
  - "ABSOLUTELY NO TEXT (other than what's part of the provided logos) anywhere in the image — no headlines, no captions, no UI labels, no readable signs, no watermarks. Text will be added later in post-production."
  - "If a laptop screen / mockup screen is shown, the screen should display abstract UI shapes only, NOT readable text — UNLESS it shows a provided brand logo as wallpaper."
  - "Single full-bleed cinematic photograph"
  - "Premium photorealistic quality, A24 film still aesthetic, shallow depth of field"
  - "Hero subject must sit in the upper-middle region (20-60% from top); bottom 25-30% reserved as quieter negative space for text overlay"
